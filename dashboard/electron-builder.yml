appId: com.emlab.daily-fev-library
productName: EMLAB
directories:
  output: release
  buildResources: build
files:
  - build-electron/**/*
  - dist/**/*
  - package.json
extraMetadata:
  main: build-electron/electron-main/index.js
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
